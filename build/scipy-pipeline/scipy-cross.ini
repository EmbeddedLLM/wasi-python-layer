[binaries]
c = '/tmp/wasi-build/wasi-sdk/bin/clang'
cpp = '/tmp/wasi-build/wasi-sdk/bin/clang++'
ar = '/tmp/wasi-build/wasi-sdk/bin/llvm-ar'
strip = '/tmp/wasi-build/wasi-sdk/bin/llvm-strip'
python = '/tmp/wasi-build/cross-python.sh'
pkg-config = '/usr/bin/pkg-config'

[built-in options]
c_args = ['--target=wasm32-wasip2', '--sysroot=/tmp/wasi-build/wasi-sdk/share/wasi-sysroot', '-fPIC', '-D__EMSCRIPTEN__=1', '-Wcast-function-type-strict', '-D_WASI_EMULATED_SIGNAL', '-DFE_UPWARD=0x800', '-DFE_DOWNWARD=0x400', '-mno-atomics', '-I/home/akk/git/wasi-python-layer/build/scipy-pipeline/sjlj-shim']
c_link_args = ['--target=wasm32-wasip2', '--sysroot=/tmp/wasi-build/wasi-sdk/share/wasi-sysroot', '-shared', '-fuse-ld=lld', '-Wl,--experimental-pic', '-Wl,--unresolved-symbols=import-dynamic', '-L/tmp/wasi-build/scipy-build/deps/lib', '-lwasi-emulated-signal', '/home/akk/git/wasi-python-layer/build/scipy-pipeline/setjmp_stub.o', '-lc++', '/home/akk/git/wasi-python-layer/build/scipy-pipeline/cxx_eh_stub.o']
cpp_args = ['--target=wasm32-wasip2', '--sysroot=/tmp/wasi-build/wasi-sdk/share/wasi-sysroot', '-fPIC', '-D__EMSCRIPTEN__=1', '-Wcast-function-type-strict', '-D_WASI_EMULATED_SIGNAL', '-DFE_UPWARD=0x800', '-DFE_DOWNWARD=0x400', '-mno-atomics', '-I/home/akk/git/wasi-python-layer/build/scipy-pipeline/sjlj-shim']
cpp_link_args = ['--target=wasm32-wasip2', '--sysroot=/tmp/wasi-build/wasi-sdk/share/wasi-sysroot', '-shared', '-fuse-ld=lld', '-Wl,--experimental-pic', '-Wl,--unresolved-symbols=import-dynamic', '-L/tmp/wasi-build/scipy-build/deps/lib', '-lwasi-emulated-signal', '/home/akk/git/wasi-python-layer/build/scipy-pipeline/setjmp_stub.o', '-lc++', '/home/akk/git/wasi-python-layer/build/scipy-pipeline/cxx_eh_stub.o']

[host_machine]
system = 'wasi'
cpu_family = 'wasm32'
cpu = 'wasm32'
endian = 'little'

[properties]
needs_exe_wrapper = true
sys_root = '/tmp/wasi-build/wasi-sdk/share/wasi-sysroot'
longdouble_format = 'IEEE_QUAD_LE'
